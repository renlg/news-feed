spring:
  datasource:
    url: jdbc:h2:file:./data/newsfeed;DB_CLOSE_ON_EXIT=FALSE
    driver-class-name: org.h2.Driver
    username: sa
    password:
  h2:
    console:
      enabled: true
      path: /h2-console
  mvc:
    hiddenmethod:
      filter:
        enabled: true
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
  thymeleaf:
    cache: false

server:
  port: 8891

newsfeed:
  fetch:
    default-interval-minutes: 15
    max-articles-per-feed: 500
  retention:
    days: 30
  backup:
    dir: ./data/backups

app:
  security:
    username: admin
    password: admin123
