<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" data-bs-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>A股 - NewsFeed</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <link href="/css/style.css" rel="stylesheet">
</head>
<body>
<nav class="navbar navbar-expand-lg navbar-dark bg-dark border-bottom border-secondary">
    <div class="container">
        <a class="navbar-brand fw-bold" href="/feeds">
            <i class="bi bi-rss-fill me-2 text-warning"></i>NewsFeed
        </a>
        <div class="navbar-nav ms-auto">
            <a class="nav-link" href="/feeds">Sources</a>
            <a class="nav-link" href="/search">Search</a>
            <a class="nav-link" href="/digest">Daily Digest</a>
            <a class="nav-link" href="/reports">Reports</a>
            <a class="nav-link active" href="/astocks">A股</a>
            <a class="nav-link" href="/reports/backups">Backups</a>
            <a class="nav-link" href="/tags">Tags</a>
            <form th:action="@{/logout}" method="post" class="d-inline">
                <button type="submit" class="btn btn-link nav-link">
                    <i class="bi bi-box-arrow-right me-1"></i>Logout
                </button>
            </form>
        </div>
    </div>
</nav>

<main class="container mt-4">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <h2 class="mb-0"><i class="bi bi-graph-up-arrow me-2 text-warning"></i>A股</h2>
        <span class="text-muted">全部 A 股公司，点击股票查看行情、估值、资金与公司数据</span>
    </div>

    <form method="get" action="/astocks" class="row g-2 mb-3 align-items-end" id="stockFilterForm">
        <div class="col-auto">
            <label for="boardFilter" class="form-label form-label-sm mb-0">板块</label>
            <select class="form-select form-select-sm" id="boardFilter" name="board" style="min-width:140px;">
                <option th:each="item : ${boards}" th:value="${item}"
                        th:selected="${board == item}" th:text="${item}">全部</option>
            </select>
        </div>
        <div class="col-auto">
            <label for="keywordInput" class="form-label form-label-sm mb-0">代码 / 名称</label>
            <input class="form-control form-control-sm" id="keywordInput" name="q" th:value="${q}"
                   placeholder="例如：600519 或 贵州茅台" autocomplete="off" style="min-width:220px;">
        </div>
        <div class="col-auto">
            <label for="pageSize" class="form-label form-label-sm mb-0">每页</label>
            <select class="form-select form-select-sm" id="pageSize" name="size" style="min-width:80px;">
                <option value="10" th:selected="${size == 10}">10</option>
                <option value="25" th:selected="${size == 25}">25</option>
                <option value="50" th:selected="${size == 50}">50</option>
                <option value="100" th:selected="${size == 100}">100</option>
            </select>
        </div>
        <div class="col-auto">
            <button type="submit" class="btn btn-sm btn-outline-primary">
                <i class="bi bi-search me-1"></i>搜索
            </button>
        </div>
    </form>

    <div id="stockTable" class="table-responsive" hidden>
        <table class="table table-dark table-striped table-hover align-middle">
            <thead>
            <tr>
                <th>代码</th>
                <th>名称</th>
                <th>板块</th>
                <th>行业</th>
                <th class="text-end">详情</th>
            </tr>
            </thead>
            <tbody id="stockTableBody"></tbody>
        </table>
    </div>

    <div id="stockPagination"></div>
</main>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="/js/ajax-pagination.js"></script>
<script>
    document.addEventListener('DOMContentLoaded', function() {
        var form = document.getElementById('stockFilterForm');
        var table = document.getElementById('stockTable');
        var body = document.getElementById('stockTableBody');
        var empty = document.getElementById('stockEmpty');
        var pager = document.getElementById('stockPagination');
        var state = new URLSearchParams(window.location.search);
        var stockPageSize = state.get('size') || document.getElementById('pageSize').value;
        var initialPage = Math.max(0, parseInt(state.get('page'), 10) || 0);
        var initialBoard = state.has('board') ? state.get('board') : document.getElementById('boardFilter').value;
        document.getElementById('boardFilter').value = initialBoard;
        document.getElementById('keywordInput').value = state.get('q') || '';
        document.getElementById('pageSize').value = stockPageSize;

        function renderStock(stock) {
            var row = document.createElement('tr');
            var code = row.insertCell(); code.className = 'font-monospace'; code.textContent = stock.secCode;
            var nameCell = row.insertCell();
            var name = AjaxPagination.element('a', 'link-light fw-semibold text-decoration-none', stock.secName);
            name.href = '/astocks/' + encodeURIComponent(stock.secCode); nameCell.appendChild(name);
            row.insertCell().appendChild(AjaxPagination.element('span', 'badge text-bg-secondary', stock.board));
            var industry = row.insertCell(); industry.className = 'text-muted'; industry.textContent = stock.industry || '-';
            var action = row.insertCell(); action.className = 'text-end';
            var link = AjaxPagination.element('a', 'btn btn-sm btn-outline-primary');
            link.href = name.href; link.appendChild(document.createTextNode('查看 '));
            link.appendChild(AjaxPagination.element('i', 'bi bi-chevron-right')); action.appendChild(link);
            return row;
        }

        function loadStocks(page, useSelectedSize) {
            if (useSelectedSize) stockPageSize = document.getElementById('pageSize').value;
            state = new URLSearchParams(new FormData(form));
            state.set('page', String(page));
            state.set('size', stockPageSize);
            AjaxPagination.request('/astocks/api', state).then(function(data) {
                state.set('page', String(data.number));
                stockPageSize = String(data.size);
                state.set('size', stockPageSize);
                document.getElementById('pageSize').value = stockPageSize;
                body.replaceChildren();
                data.content.forEach(function(stock) { body.appendChild(renderStock(stock)); });
                table.hidden = data.content.length === 0;
                if (!empty) {
                    empty = AjaxPagination.element('div', 'text-center text-muted py-5');
                    empty.appendChild(AjaxPagination.element('i', 'bi bi-inbox'));
                    empty.appendChild(AjaxPagination.element('p', 'mt-2', '没有符合条件的股票'));
                    table.before(empty);
                }
                empty.hidden = data.content.length !== 0;
                pager.replaceChildren(data.content.length ? AjaxPagination.pagination(data, loadStocks, {
                    radius: 2, rangePrefix: '显示 ', rangeSeparator: '，共 ', rangeSuffix: ' 只'
                }) : document.createTextNode(''));
                history.replaceState(null, '', '/astocks?' + state.toString());
            }).catch(function(error) { window.alert(error.message); });
        }

        form.addEventListener('submit', function(event) { event.preventDefault(); loadStocks(0, true); });
        document.getElementById('boardFilter').addEventListener('change', function() { loadStocks(0, true); });
        document.getElementById('pageSize').addEventListener('change', function() { loadStocks(0, true); });
        loadStocks(initialPage);
    });
</script>
</body>
</html>
