<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" data-bs-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tags - NewsFeed</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <link href="/css/style.css" rel="stylesheet">
</head>
<body>
<nav class="navbar navbar-expand-lg navbar-dark bg-dark border-bottom border-secondary">
    <div class="container">
        <a class="navbar-brand fw-bold" href="/feeds">
            <i class="bi bi-rss-fill me-2 text-warning"></i>NewsFeed
        </a>
        <div class="navbar-nav ms-auto">
            <a class="nav-link" href="/feeds">Sources</a>
            <a class="nav-link" href="/search">Search</a>
            <a class="nav-link" href="/reports">Reports</a>
            <a class="nav-link" href="/reports/backups">Backups</a>
            <a class="nav-link active" href="/tags">Tags</a>
            <form th:action="@{/logout}" method="post" class="d-inline">
                <button type="submit" class="btn btn-link nav-link">
                    <i class="bi bi-box-arrow-right me-1"></i>Logout
                </button>
            </form>
        </div>
    </div>
</nav>

<div class="container mt-4">
    <div th:if="${successMsg}" class="alert alert-success alert-dismissible fade show" role="alert">
        <i class="bi bi-check-circle me-2"></i><span th:text="${successMsg}"></span>
        <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
    </div>
    <div th:if="${errorMsg}" class="alert alert-danger alert-dismissible fade show" role="alert">
        <i class="bi bi-exclamation-triangle me-2"></i><span th:text="${errorMsg}"></span>
        <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
    </div>

    <div class="d-flex justify-content-between align-items-center mb-4">
        <h2 class="mb-0">Tag Management</h2>
    </div>

    <!-- Add tag form -->
    <div class="card bg-dark border-secondary mb-4">
        <div class="card-body">
            <h5 class="card-title">Add New Tag</h5>
            <form method="post" action="/tags" class="row g-2 align-items-end">
                <input type="hidden" name="_csrf" th:value="${_csrf.token}"/>
                <div class="col-auto">
                    <label for="tagName" class="form-label">Name</label>
                    <input type="text" class="form-control" id="tagName" name="name"
                           placeholder="e.g. Technology" required>
                </div>
                <div class="col-auto">
                    <label for="tagColor" class="form-label">Color</label>
                    <input type="color" class="form-control form-control-color" id="tagColor"
                           name="color" value="#6c757d">
                </div>
                <div class="col-auto">
                    <button type="submit" class="btn btn-primary">
                        <i class="bi bi-plus-lg me-1"></i>Add Tag
                    </button>
                </div>
            </form>
        </div>
    </div>

    <!-- Tags table -->
    <div class="table-responsive">
        <table class="table table-dark table-striped table-hover align-middle">
            <thead>
            <tr>
                <th>Name</th>
                <th>Color</th>
                <th>Preview</th>
                <th>Actions</th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="tag : ${tags}">
                <td class="fw-semibold" th:text="${tag.name}">Tag Name</td>
                <td>
                    <span class="badge" th:style="'background-color:' + ${tag.color}"
                          th:text="${tag.color}">#6c757d</span>
                </td>
                <td>
                    <span class="badge" th:style="'background-color:' + ${tag.color}"
                          th:text="${tag.name}">Tag</span>
                </td>
                <td>
                    <form method="post" th:action="@{/tags/{id}/delete(id=${tag.id})}" class="d-inline"
                          onsubmit="return confirm('Are you sure you want to delete tag \'' + this.querySelector('[data-name]').dataset.name + '\'?');">
                        <input type="hidden" name="_csrf" th:value="${_csrf.token}"/>
                        <input type="hidden" th:attr="data-name=${tag.name}"/>
                        <button type="submit" class="btn btn-sm btn-outline-danger" title="Delete">
                            <i class="bi bi-trash"></i> Delete
                        </button>
                    </form>
                </td>
            </tr>
            <tr th:if="${#lists.isEmpty(tags)}">
                <td colspan="4" class="text-center text-muted py-4">
                    No tags created yet. Use the form above to add your first tag.
                </td>
            </tr>
            </tbody>
        </table>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
