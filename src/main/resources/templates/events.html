<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" data-bs-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>重大事件 - NewsFeed</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <link href="/css/style.css" rel="stylesheet">
</head>
<body>
<nav class="navbar navbar-expand-lg navbar-dark bg-dark border-bottom border-secondary">
    <div class="container">
        <a class="navbar-brand fw-bold" href="/feeds">
            <i class="bi bi-rss-fill me-2 text-warning"></i>NewsFeed
        </a>
        <div class="navbar-nav ms-auto">
            <a class="nav-link" href="/feeds">Sources</a>
            <a class="nav-link" href="/search">Search</a>
            <a class="nav-link" href="/digest">Daily Digest</a>
            <a class="nav-link" href="/reports">Reports</a>
            <a class="nav-link" href="/financial">Financial Reports</a>
            <a class="nav-link active" href="/events">重大事件</a>
            <a class="nav-link" href="/reports/backups">Backups</a>
            <a class="nav-link" href="/tags">Tags</a>
            <form th:action="@{/logout}" method="post" class="d-inline">
                <button type="submit" class="btn btn-link nav-link">
                    <i class="bi bi-box-arrow-right me-1"></i>Logout
                </button>
            </form>
        </div>
    </div>
</nav>

<div class="container-fluid px-3 px-xl-5 mt-4">
    <div class="d-flex flex-wrap justify-content-between align-items-center gap-3 mb-4">
        <div>
            <h2 class="mb-1"><i class="bi bi-exclamation-diamond-fill me-2 text-warning"></i>重大事件</h2>
            <div class="text-muted">A股上市公司重大公告（数据来源：巨潮资讯网）</div>
        </div>
        <div th:if="${!fetching}" class="d-flex flex-wrap gap-2">
            <form th:action="@{/events/backfill}" method="post"
                  onsubmit="return confirm('回填最近1年公告可能需要较长时间，确认继续？')">
                <input type="hidden" name="_csrf" th:value="${_csrf.token}">
                <button type="submit" class="btn btn-outline-warning">
                    <i class="bi bi-database-fill-down me-1"></i>回填最近1年
                </button>
            </form>
            <form th:action="@{/events/fetch}" method="post">
                <input type="hidden" name="_csrf" th:value="${_csrf.token}">
                <button type="submit" class="btn btn-warning">
                    <i class="bi bi-arrow-clockwise me-1"></i>手动刷新
                </button>
            </form>
        </div>
        <button th:if="${fetching}" type="button" class="btn btn-warning" disabled>
            <span class="spinner-border spinner-border-sm me-1" aria-hidden="true"></span>抓取中…
        </button>
    </div>

    <div th:if="${successMsg}" class="alert alert-success alert-dismissible fade show" role="alert">
        <i class="bi bi-check-circle me-2"></i><span th:text="${successMsg}"></span>
        <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
    </div>
    <div th:if="${errorMsg}" class="alert alert-danger alert-dismissible fade show" role="alert">
        <i class="bi bi-exclamation-triangle me-2"></i><span th:text="${errorMsg}"></span>
        <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
    </div>

    <form method="get" action="/events" class="card bg-dark border-secondary mb-4">
        <div class="card-body">
            <div class="row g-3 align-items-end">
                <div class="col-md-3">
                    <label for="categoryFilter" class="form-label">分类</label>
                    <select class="form-select" id="categoryFilter" name="category">
                        <option value="">全部分类</option>
                        <option th:each="item : ${categories}" th:value="${item}"
                                th:selected="${category == item}" th:text="${item}">回购</option>
                    </select>
                </div>
                <div class="col-md-5">
                    <label for="keywordInput" class="form-label">标题 / 公司</label>
                    <input type="text" class="form-control" id="keywordInput" name="q"
                           th:value="${q}" placeholder="例如：贵州茅台 或 回购股份">
                </div>
                <div class="col-md-2">
                    <label for="pageSize" class="form-label">每页</label>
                    <select class="form-select" id="pageSize" name="size">
                        <option value="25" th:selected="${size == 25}">25</option>
                        <option value="50" th:selected="${size == 50}">50</option>
                        <option value="100" th:selected="${size == 100}">100</option>
                    </select>
                </div>
                <div class="col-md-2">
                    <button type="submit" class="btn btn-primary w-100">
                        <i class="bi bi-search me-1"></i>筛选
                    </button>
                </div>
            </div>
        </div>
    </form>

    <div th:if="${events.empty}" class="text-center text-muted py-5">
        <i class="bi bi-inbox" style="font-size: 3rem;"></i>
        <p class="mt-2">暂无重大事件数据。可点击“手动刷新”抓取最近公告。</p>
    </div>

    <div th:unless="${events.empty}" class="table-responsive">
        <table class="table table-dark table-striped table-hover align-middle">
            <thead>
            <tr>
                <th class="text-nowrap">日期</th>
                <th class="text-nowrap">公司</th>
                <th>标题</th>
                <th class="text-nowrap">分类</th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="event : ${events.content}">
                <td class="text-nowrap" th:text="${event.eventDate}">2026-08-25</td>
                <td class="text-nowrap">
                    <div th:text="${event.secName}">贵州茅台</div>
                    <small class="text-muted font-monospace" th:text="${event.secCode}">600519</small>
                </td>
                <td>
                    <a class="link-primary text-decoration-underline link-offset-2" th:href="@{/events/detail(id=${event.id})}"
                       th:text="${event.title}">公告标题</a>
                </td>
                <td><span class="badge text-bg-warning" th:text="${event.category}">回购</span></td>
            </tr>
            </tbody>
        </table>
    </div>

    <div th:if="${events.totalPages > 1}" class="d-flex flex-wrap justify-content-between align-items-center gap-3 mt-3 mb-4">
        <div class="text-muted">
            <span th:text="'显示 ' + ${events.number * events.size + 1} + '-' + ${events.number * events.size + events.content.size()} + '，共 ' + ${events.totalElements} + ' 条'">显示范围</span>
        </div>
        <nav aria-label="重大事件分页">
            <ul class="pagination pagination-sm mb-0">
                <li class="page-item" th:classappend="${events.first} ? 'disabled'">
                    <a class="page-link" th:href="@{/events(category=${category}, q=${q}, size=${size}, page=${events.number - 1})}" aria-label="上一页">&laquo;</a>
                </li>
                <li class="page-item" th:classappend="${events.number == 0} ? 'active'">
                    <a class="page-link" th:href="@{/events(category=${category}, q=${q}, size=${size}, page=0)}">1</a>
                </li>
                <li th:if="${events.number > 3}" class="page-item disabled"><span class="page-link">…</span></li>
                <li th:each="i : ${#numbers.sequence(events.number - 1, events.number + 1)}"
                    th:if="${i > 0 && i < events.totalPages - 1}" class="page-item"
                    th:classappend="${i == events.number} ? 'active'">
                    <a class="page-link" th:href="@{/events(category=${category}, q=${q}, size=${size}, page=${i})}"
                       th:text="${i + 1}">2</a>
                </li>
                <li th:if="${events.number < events.totalPages - 4}" class="page-item disabled"><span class="page-link">…</span></li>
                <li class="page-item" th:classappend="${events.number == events.totalPages - 1} ? 'active'">
                    <a class="page-link" th:href="@{/events(category=${category}, q=${q}, size=${size}, page=${events.totalPages - 1})}"
                       th:text="${events.totalPages}">末页</a>
                </li>
                <li class="page-item" th:classappend="${events.last} ? 'disabled'">
                    <a class="page-link" th:href="@{/events(category=${category}, q=${q}, size=${size}, page=${events.number + 1})}" aria-label="下一页">&raquo;</a>
                </li>
            </ul>
        </nav>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
