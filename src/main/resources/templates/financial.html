<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" data-bs-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Financial Reports - NewsFeed</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <link href="/css/style.css" rel="stylesheet">
    <style>
        .sortable-header .sort-label,
        .sortable-header .sort-direction {
            color: inherit;
            background: none;
            border: 0;
            padding: 0;
            font: inherit;
            cursor: pointer;
        }

        .sortable-header .sort-label:hover,
        .sortable-header .sort-direction:hover {
            color: var(--bs-warning);
        }

        .sortable-header .sort-direction {
            margin-left: .2rem;
        }
    </style>
</head>
<body>
<nav class="navbar navbar-expand-lg navbar-dark bg-dark border-bottom border-secondary">
    <div class="container">
        <a class="navbar-brand fw-bold" href="/feeds">
            <i class="bi bi-rss-fill me-2 text-warning"></i>NewsFeed
        </a>
        <div class="navbar-nav ms-auto">
            <a class="nav-link" href="/feeds">Sources</a>
            <a class="nav-link" href="/search">Search</a>
            <a class="nav-link" href="/digest">Daily Digest</a>
            <a class="nav-link" href="/reports">Reports</a>
            <a class="nav-link active" href="/financial">Financial Reports</a>
            <a class="nav-link" href="/reports/backups">Backups</a>
            <a class="nav-link" href="/tags">Tags</a>
            <form th:action="@{/logout}" method="post" class="d-inline">
                <button type="submit" class="btn btn-link nav-link">
                    <i class="bi bi-box-arrow-right me-1"></i>Logout
                </button>
            </form>
        </div>
    </div>
</nav>

<div class="container-fluid px-3 px-xl-5 mt-4">
    <div class="d-flex flex-wrap justify-content-between align-items-center gap-3 mb-4">
        <div>
            <h2 class="mb-1"><i class="bi bi-building me-2 text-warning"></i>财报</h2>
            <div class="text-muted">A股上市公司主要财务指标（数据来源：东方财富）</div>
        </div>
        <form th:action="@{/financial/fetch}" method="post">
            <button type="submit" class="btn btn-warning" th:disabled="${fetching}">
                <i class="bi bi-arrow-clockwise me-1"></i>
                <span th:text="${fetching} ? '抓取中…' : '手动刷新'">手动刷新</span>
            </button>
        </form>
    </div>

    <div th:if="${successMsg}" class="alert alert-success alert-dismissible fade show" role="alert">
        <i class="bi bi-check-circle me-2"></i><span th:text="${successMsg}"></span>
        <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
    </div>
    <div th:if="${errorMsg}" class="alert alert-danger alert-dismissible fade show" role="alert">
        <i class="bi bi-exclamation-triangle me-2"></i><span th:text="${errorMsg}"></span>
        <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
    </div>

    <form method="get" action="/financial" class="card bg-dark border-secondary mb-4">
        <input th:if="${!#strings.isEmpty(sort)}" type="hidden" name="sort" th:value="${sort}">
        <input th:if="${!#strings.isEmpty(sort)}" type="hidden" name="dir" th:value="${dir}">
        <div class="card-body">
            <div class="row g-3 align-items-end">
                <div class="col-md-3">
                    <label for="periodFilter" class="form-label">报告期</label>
                    <select class="form-select" id="periodFilter" name="period">
                        <option value="">全部报告期</option>
                        <option th:each="item : ${periods}"
                                th:value="${item}"
                                th:selected="${period == item}"
                                th:text="${item}">2026Q2</option>
                    </select>
                </div>
                <div class="col-md-5">
                    <label for="keywordInput" class="form-label">代码 / 名称</label>
                    <input type="text" class="form-control" id="keywordInput" name="q"
                           th:value="${q}" placeholder="例如：600519 或 贵州茅台">
                </div>
                <div class="col-md-2">
                    <label for="pageSize" class="form-label">每页</label>
                    <select class="form-select" id="pageSize" name="size">
                        <option value="25" th:selected="${size == 25}">25</option>
                        <option value="50" th:selected="${size == 50}">50</option>
                        <option value="100" th:selected="${size == 100}">100</option>
                    </select>
                </div>
                <div class="col-md-2">
                    <button type="submit" class="btn btn-primary w-100">
                        <i class="bi bi-search me-1"></i>筛选
                    </button>
                </div>
            </div>
        </div>
    </form>

    <div th:if="${reports.empty}" class="text-center text-muted py-5">
        <i class="bi bi-inbox" style="font-size: 3rem;"></i>
        <p class="mt-2">暂无财报数据。点击“手动刷新”从东方财富抓取。</p>
    </div>

    <div th:unless="${reports.empty}" class="table-responsive">
        <table class="table table-dark table-striped table-hover align-middle text-nowrap">
            <thead>
            <tr>
                <th class="sortable-header" data-sort-key="secCode">
                    <button type="button" class="sort-label">代码</button><button th:if="${sort == 'secCode'}" type="button" class="sort-direction" th:title="${dir == 'asc' ? '切换为降序' : '切换为升序'}" th:aria-label="${dir == 'asc' ? '切换为降序' : '切换为升序'}"><i th:class="${dir == 'asc' ? 'bi bi-caret-up-fill' : 'bi bi-caret-down-fill'}"></i></button>
                </th>
                <th class="sortable-header" data-sort-key="secName">
                    <button type="button" class="sort-label">名称</button><button th:if="${sort == 'secName'}" type="button" class="sort-direction" th:title="${dir == 'asc' ? '切换为降序' : '切换为升序'}" th:aria-label="${dir == 'asc' ? '切换为降序' : '切换为升序'}"><i th:class="${dir == 'asc' ? 'bi bi-caret-up-fill' : 'bi bi-caret-down-fill'}"></i></button>
                </th>
                <th class="sortable-header" data-sort-key="reportPeriod">
                    <button type="button" class="sort-label">报告期</button><button th:if="${sort == 'reportPeriod'}" type="button" class="sort-direction" th:title="${dir == 'asc' ? '切换为降序' : '切换为升序'}" th:aria-label="${dir == 'asc' ? '切换为降序' : '切换为升序'}"><i th:class="${dir == 'asc' ? 'bi bi-caret-up-fill' : 'bi bi-caret-down-fill'}"></i></button>
                </th>
                <th class="sortable-header text-end" data-sort-key="totalOperateIncome">
                    <button type="button" class="sort-label">营收(亿)</button><button th:if="${sort == 'totalOperateIncome'}" type="button" class="sort-direction" th:title="${dir == 'asc' ? '切换为降序' : '切换为升序'}" th:aria-label="${dir == 'asc' ? '切换为降序' : '切换为升序'}"><i th:class="${dir == 'asc' ? 'bi bi-caret-up-fill' : 'bi bi-caret-down-fill'}"></i></button>
                </th>
                <th class="sortable-header text-end" data-sort-key="parentNetProfit">
                    <button type="button" class="sort-label">净利润(亿)</button><button th:if="${sort == 'parentNetProfit'}" type="button" class="sort-direction" th:title="${dir == 'asc' ? '切换为降序' : '切换为升序'}" th:aria-label="${dir == 'asc' ? '切换为降序' : '切换为升序'}"><i th:class="${dir == 'asc' ? 'bi bi-caret-up-fill' : 'bi bi-caret-down-fill'}"></i></button>
                </th>
                <th class="sortable-header text-end" data-sort-key="basicEps">
                    <button type="button" class="sort-label">EPS</button><button th:if="${sort == 'basicEps'}" type="button" class="sort-direction" th:title="${dir == 'asc' ? '切换为降序' : '切换为升序'}" th:aria-label="${dir == 'asc' ? '切换为降序' : '切换为升序'}"><i th:class="${dir == 'asc' ? 'bi bi-caret-up-fill' : 'bi bi-caret-down-fill'}"></i></button>
                </th>
                <th class="sortable-header text-end" data-sort-key="weightAvgRoe">
                    <button type="button" class="sort-label">ROE%</button><button th:if="${sort == 'weightAvgRoe'}" type="button" class="sort-direction" th:title="${dir == 'asc' ? '切换为降序' : '切换为升序'}" th:aria-label="${dir == 'asc' ? '切换为降序' : '切换为升序'}"><i th:class="${dir == 'asc' ? 'bi bi-caret-up-fill' : 'bi bi-caret-down-fill'}"></i></button>
                </th>
                <th class="sortable-header text-end" data-sort-key="ystz">
                    <button type="button" class="sort-label">营收同比%</button><button th:if="${sort == 'ystz'}" type="button" class="sort-direction" th:title="${dir == 'asc' ? '切换为降序' : '切换为升序'}" th:aria-label="${dir == 'asc' ? '切换为降序' : '切换为升序'}"><i th:class="${dir == 'asc' ? 'bi bi-caret-up-fill' : 'bi bi-caret-down-fill'}"></i></button>
                </th>
                <th class="sortable-header text-end" data-sort-key="sjltz">
                    <button type="button" class="sort-label">净利同比%</button><button th:if="${sort == 'sjltz'}" type="button" class="sort-direction" th:title="${dir == 'asc' ? '切换为降序' : '切换为升序'}" th:aria-label="${dir == 'asc' ? '切换为降序' : '切换为升序'}"><i th:class="${dir == 'asc' ? 'bi bi-caret-up-fill' : 'bi bi-caret-down-fill'}"></i></button>
                </th>
                <th class="sortable-header" data-sort-key="noticeDate">
                    <button type="button" class="sort-label">公告日期</button><button th:if="${sort == 'noticeDate'}" type="button" class="sort-direction" th:title="${dir == 'asc' ? '切换为降序' : '切换为升序'}" th:aria-label="${dir == 'asc' ? '切换为降序' : '切换为升序'}"><i th:class="${dir == 'asc' ? 'bi bi-caret-up-fill' : 'bi bi-caret-down-fill'}"></i></button>
                </th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="report : ${reports.content}">
                <td class="font-monospace" th:text="${report.secCode}">600519</td>
                <td th:text="${report.secName}">贵州茅台</td>
                <td>
                    <span th:text="${report.reportPeriod}">2026Q2</span>
                    <span th:if="${report.reportType != null}" class="badge bg-secondary ms-1"
                          th:text="${report.reportType}">半年报</span>
                </td>
                <td class="text-end" th:text="${report.totalOperateIncome == null ? '-' : #numbers.formatDecimal(report.totalOperateIncome / 100000000.0, 1, 2)}">0.00</td>
                <td class="text-end" th:text="${report.parentNetProfit == null ? '-' : #numbers.formatDecimal(report.parentNetProfit / 100000000.0, 1, 2)}">0.00</td>
                <td class="text-end" th:text="${report.basicEps == null ? '-' : #numbers.formatDecimal(report.basicEps, 1, 2)}">0.00</td>
                <td class="text-end" th:text="${report.weightAvgRoe == null ? '-' : #numbers.formatDecimal(report.weightAvgRoe, 1, 2)}">0.00</td>
                <td class="text-end" th:classappend="${report.ystz != null && report.ystz < 0} ? 'text-success' : 'text-danger'"
                    th:text="${report.ystz == null ? '-' : #numbers.formatDecimal(report.ystz, 1, 2)}">0.00</td>
                <td class="text-end" th:classappend="${report.sjltz != null && report.sjltz < 0} ? 'text-success' : 'text-danger'"
                    th:text="${report.sjltz == null ? '-' : #numbers.formatDecimal(report.sjltz, 1, 2)}">0.00</td>
                <td th:text="${report.noticeDate == null ? '-' : report.noticeDate}">2026-08-25</td>
            </tr>
            </tbody>
        </table>
    </div>

    <div th:if="${reports.totalPages > 1}" class="d-flex flex-wrap justify-content-between align-items-center gap-3 mt-3 mb-4">
        <div class="text-muted">
            <span th:text="'显示 ' + ${reports.number * reports.size + 1} + '-' + ${reports.number * reports.size + reports.content.size()} + '，共 ' + ${reports.totalElements} + ' 条'">显示范围</span>
        </div>
        <nav aria-label="Financial report pages">
            <ul class="pagination pagination-sm mb-0">
                <li class="page-item" th:classappend="${reports.first} ? 'disabled'">
                    <a class="page-link" th:href="@{/financial(period=${period}, q=${q}, size=${size}, sort=${sort}, dir=${dir}, page=${reports.number - 1})}" aria-label="Previous">&laquo;</a>
                </li>
                <li class="page-item" th:classappend="${reports.number == 0} ? 'active'">
                    <a class="page-link" th:href="@{/financial(period=${period}, q=${q}, size=${size}, sort=${sort}, dir=${dir}, page=0)}">1</a>
                </li>
                <li th:if="${reports.number > 3}" class="page-item disabled"><span class="page-link">…</span></li>
                <li th:each="i : ${#numbers.sequence(reports.number - 1, reports.number + 1)}"
                    th:if="${i > 0 && i < reports.totalPages - 1}"
                    class="page-item" th:classappend="${i == reports.number} ? 'active'">
                    <a class="page-link" th:href="@{/financial(period=${period}, q=${q}, size=${size}, sort=${sort}, dir=${dir}, page=${i})}" th:text="${i + 1}">2</a>
                </li>
                <li th:if="${reports.number < reports.totalPages - 4}" class="page-item disabled"><span class="page-link">…</span></li>
                <li class="page-item" th:classappend="${reports.number == reports.totalPages - 1} ? 'active'">
                    <a class="page-link" th:href="@{/financial(period=${period}, q=${q}, size=${size}, sort=${sort}, dir=${dir}, page=${reports.totalPages - 1})}"
                       th:text="${reports.totalPages}">Last</a>
                </li>
                <li class="page-item" th:classappend="${reports.last} ? 'disabled'">
                    <a class="page-link" th:href="@{/financial(period=${period}, q=${q}, size=${size}, sort=${sort}, dir=${dir}, page=${reports.number + 1})}" aria-label="Next">&raquo;</a>
                </li>
            </ul>
        </nav>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script>
    document.querySelectorAll('.sortable-header').forEach(header => {
        const sortKey = header.dataset.sortKey;
        const label = header.querySelector('.sort-label');
        const arrow = header.querySelector('.sort-direction');

        label.addEventListener('click', () => {
            const params = new URLSearchParams(window.location.search);
            if (params.get('sort') === sortKey) {
                params.delete('sort');
                params.delete('dir');
            } else {
                params.set('sort', sortKey);
                params.set('dir', 'asc');
            }
            params.set('page', '0');
            window.location.assign('/financial?' + params.toString());
        });

        if (arrow) {
            arrow.addEventListener('click', () => {
                const params = new URLSearchParams(window.location.search);
                params.set('sort', sortKey);
                params.set('dir', params.get('dir') === 'desc' ? 'asc' : 'desc');
                params.set('page', '0');
                window.location.assign('/financial?' + params.toString());
            });
        }
    });
</script>
</body>
</html>
