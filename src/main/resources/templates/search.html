<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security" data-bs-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Search - NewsFeed</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <link href="/css/style.css" rel="stylesheet">
</head>
<body>
<nav class="navbar navbar-expand-lg navbar-dark bg-dark border-bottom border-secondary">
    <div class="container">
        <a class="navbar-brand fw-bold" href="/digest">
            <i class="bi bi-rss-fill me-2 text-warning"></i>NewsFeed
        </a>
        <div class="navbar-nav ms-auto" sec:authorize="isAuthenticated()">
            <a class="nav-link" href="/feeds">Sources</a>
            <a class="nav-link active" href="/search">Search</a>
            <a class="nav-link" href="/digest">Daily Digest</a>
            <a class="nav-link" href="/reports">Reports</a>
            <a class="nav-link" href="/astocks">A股</a>
            <a class="nav-link" href="/reports/backups">Backups</a>
            <a class="nav-link" href="/tags">Tags</a>
            <form th:action="@{/logout}" method="post" class="d-inline">
                <button type="submit" class="btn btn-link nav-link">
                    <i class="bi bi-box-arrow-right me-1"></i>Logout
                </button>
            </form>
        </div>
        <div class="navbar-nav ms-auto" sec:authorize="!isAuthenticated()">
            <a class="nav-link active" href="/search">Search</a>
            <a class="nav-link" href="/digest">Daily Digest</a>
            <a class="nav-link" href="/login">
                <i class="bi bi-box-arrow-in-right me-1"></i>Login
            </a>
        </div>
    </div>
</nav>

<div class="container mt-4">
    <h2 class="mb-4"><i class="bi bi-search me-2"></i>Search Articles</h2>

    <form method="get" action="/search" class="mb-4" id="searchFilterForm">
        <div class="row g-2 align-items-end">
            <div class="col-md-4">
                <label for="searchInput" class="form-label">Keyword</label>
                <input type="text" class="form-control" id="searchInput" name="q"
                       th:value="${q}" placeholder="Search articles...">
            </div>
            <div class="col-md-2">
                <label for="sourceFilter" class="form-label">Source</label>
                <select class="form-select" id="sourceFilter" name="sourceId">
                    <option value="">All Sources</option>
                    <option th:each="source : ${sources}"
                            th:value="${source.id}"
                            th:selected="${sourceId != null && sourceId == source.id}"
                            th:text="${source.name}">Source</option>
                </select>
            </div>
            <div class="col-md-2">
                <label for="categoryFilter" class="form-label">AI分类</label>
                <select class="form-select" id="categoryFilter" name="category">
                    <option value="">全部AI分类</option>
                    <option th:each="cat : ${categories}"
                            th:value="${cat}"
                            th:selected="${category != null && category == cat}"
                            th:text="${cat}">AI分类</option>
                    <option value="__NULL__"
                            th:selected="${category != null && (category == '__NULL__' || category == '__NO_CATEGORY__')}">其他</option>
                </select>
            </div>
            <div class="col-md-2">
                <label for="sortSelect" class="form-label">Sort By</label>
                <select class="form-select" id="sortSelect" name="sort">
                    <option value="newest" th:selected="${sort == 'newest'}">Newest First</option>
                    <option value="oldest" th:selected="${sort == 'oldest'}">Oldest First</option>
                    <option value="title" th:selected="${sort == 'title'}">Title A-Z</option>
                </select>
            </div>
            <div class="col-md-2">
                <button type="submit" class="btn btn-primary w-100">
                    <i class="bi bi-search me-1"></i>Search
                </button>
            </div>
        </div>
    </form>

    <div class="list-group" id="searchResults"></div>
    <div id="searchPagination"></div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="/js/ajax-pagination.js"></script>
<script>
    document.addEventListener('DOMContentLoaded', function () {
        var form = document.getElementById('searchFilterForm');
        var results = document.getElementById('searchResults');
        var count = document.getElementById('searchResultCount');
        var empty = document.getElementById('searchEmpty');
        var pager = document.getElementById('searchPagination');
        var state = new URLSearchParams(window.location.search);
        if (!state.has('size')) state.set('size', '10');
        var searchPageSize = state.get('size');
        var initialPage = Math.max(0, parseInt(state.get('page'), 10) || 0);
        document.getElementById('searchInput').value = state.get('q') || '';
        document.getElementById('sourceFilter').value = state.get('sourceId') || '';
        var initialCategory = state.get('category') || '';
        document.getElementById('categoryFilter').value = initialCategory === '__NO_CATEGORY__' ? '__NULL__' : initialCategory;
        document.getElementById('sortSelect').value = state.get('sort') || 'newest';

        function renderArticle(article) {
            var card = AjaxPagination.element('a', 'list-group-item list-group-item-action bg-dark border-secondary mb-2 article-card');
            if (article.link) { card.href = article.link; card.target = '_blank'; card.rel = 'noopener noreferrer'; }
            var header = AjaxPagination.element('div', 'd-flex w-100 justify-content-between');
            header.appendChild(AjaxPagination.element('h5', 'mb-1 text-light', article.title));
            header.appendChild(AjaxPagination.element('small', 'text-muted text-nowrap ms-3',
                AjaxPagination.dateTime(article.publishedAt || article.fetchedAt)));
            card.appendChild(header);
            if (article.summary) {
                var plain = article.summary.replace(/<[^>]+>/g, '');
                card.appendChild(AjaxPagination.element('p', 'mb-1 text-secondary article-summary',
                    plain.length > 200 ? plain.slice(0, 197) + '...' : plain));
            }
            var footer = AjaxPagination.element('div', 'd-flex justify-content-between align-items-center mt-1');
            var meta = AjaxPagination.element('small', 'text-info');
            var icon = AjaxPagination.element('i', 'bi bi-rss me-1'); meta.appendChild(icon);
            meta.appendChild(document.createTextNode(article.feedSourceName || ''));
            meta.appendChild(AjaxPagination.element('span', 'badge bg-secondary ms-2', article.category || '其他'));
            if (article.aiProcessed && article.aiCategoryDisplayName) meta.appendChild(
                AjaxPagination.element('span', 'badge bg-primary ms-2', 'AI分类 · ' + article.aiCategoryDisplayName));
            if (article.aiProcessed && article.importanceScore != null) meta.appendChild(
                AjaxPagination.element('span', 'badge bg-warning text-dark ms-1', article.importanceScore + '分'));
            footer.appendChild(meta);
            if (article.author) {
                var author = AjaxPagination.element('small', 'text-muted');
                author.appendChild(AjaxPagination.element('i', 'bi bi-person me-1'));
                author.appendChild(document.createTextNode(article.author));
                footer.appendChild(author);
            }
            card.appendChild(footer);
            return card;
        }

        function load(page) {
            state = new URLSearchParams(new FormData(form));
            state.set('page', String(page));
            state.set('size', searchPageSize);
            AjaxPagination.request('/search/api', state).then(function (data) {
                state.set('page', String(data.number));
                searchPageSize = String(data.size);
                state.set('size', searchPageSize);
                results.replaceChildren.apply(results, data.content.map(renderArticle));
                if (!count) { count = AjaxPagination.element('div', 'mb-3 text-muted'); form.after(count); }
                count.textContent = data.totalElements ? 'Found ' + data.totalElements + ' articles'
                    + (data.totalPages > 1 ? ' (page ' + (data.number + 1) + ' of ' + data.totalPages + ')' : '') : '';
                count.hidden = data.totalElements === 0;
                if (!empty) {
                    empty = AjaxPagination.element('div', 'text-center text-muted py-5');
                    empty.appendChild(AjaxPagination.element('i', 'bi bi-inbox'));
                    empty.appendChild(AjaxPagination.element('p', 'mt-2', 'No articles found. Try a different search term or add more feed sources.'));
                    results.before(empty);
                }
                empty.hidden = data.totalElements !== 0;
                pager.replaceChildren(AjaxPagination.pagination(data, load, { jump: true, rangeOnlyWhenPaginated: true }));
                history.replaceState(null, '', '/search?' + state.toString());
            }).catch(function (error) { window.alert(error.message); });
        }
        form.addEventListener('submit', function (event) { event.preventDefault(); load(0); });
        load(initialPage);
    });
</script>
</body>
</html>
