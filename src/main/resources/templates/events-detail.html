<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" data-bs-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>重大事件详情 - NewsFeed</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <link href="/css/style.css" rel="stylesheet">
</head>
<body>
<nav class="navbar navbar-expand-lg navbar-dark bg-dark border-bottom border-secondary">
    <div class="container">
        <a class="navbar-brand fw-bold" href="/feeds">
            <i class="bi bi-rss-fill me-2 text-warning"></i>NewsFeed
        </a>
        <div class="navbar-nav ms-auto">
            <a class="nav-link" href="/feeds">Sources</a>
            <a class="nav-link" href="/search">Search</a>
            <a class="nav-link" href="/digest">Daily Digest</a>
            <a class="nav-link" href="/reports">Reports</a>
            <a class="nav-link" href="/financial">Financial Reports</a>
            <a class="nav-link active" href="/events">重大事件</a>
            <a class="nav-link" href="/reports/backups">Backups</a>
            <a class="nav-link" href="/tags">Tags</a>
            <form th:action="@{/logout}" method="post" class="d-inline">
                <button type="submit" class="btn btn-link nav-link">
                    <i class="bi bi-box-arrow-right me-1"></i>Logout
                </button>
            </form>
        </div>
    </div>
</nav>

<div class="container mt-4">
    <a href="/events" class="btn btn-sm btn-outline-secondary mb-3">
        <i class="bi bi-arrow-left me-1"></i>返回重大事件
    </a>
    <div class="card bg-dark border-secondary">
        <div class="card-body p-4">
            <div class="d-flex flex-wrap justify-content-between align-items-start gap-3 mb-4">
                <h2 class="h4 mb-0" th:text="${event.title}">公告标题</h2>
                <span class="badge text-bg-warning fs-6" th:text="${event.category}">回购</span>
            </div>
            <dl class="row mb-4">
                <dt class="col-sm-2 text-muted">公司</dt>
                <dd class="col-sm-10">
                    <span th:text="${event.secName}">贵州茅台</span>
                    <span class="text-muted font-monospace ms-2" th:text="${event.secCode}">600519</span>
                </dd>
                <dt class="col-sm-2 text-muted">公告日期</dt>
                <dd class="col-sm-10" th:text="${event.eventDate}">2026-08-25</dd>
                <dt class="col-sm-2 text-muted">分类</dt>
                <dd class="col-sm-10" th:text="${event.category}">回购</dd>
            </dl>
            <a th:if="${event.pdfPath != null}" th:href="@{/events/pdf/{id}(id=${event.id})}"
               target="_blank" rel="noopener" class="btn btn-warning">
                <i class="bi bi-file-earmark-pdf me-1"></i>查看PDF
            </a>
            <span th:unless="${event.pdfPath != null}" class="text-muted">
                <i class="bi bi-exclamation-circle me-1"></i>PDF 暂未下载成功
            </span>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
