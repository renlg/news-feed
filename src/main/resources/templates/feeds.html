<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" data-bs-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Feed Sources - NewsFeed</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <link href="/css/style.css" rel="stylesheet">
</head>
<body>
<nav class="navbar navbar-expand-lg navbar-dark bg-dark border-bottom border-secondary">
    <div class="container">
        <a class="navbar-brand fw-bold" href="/feeds">
            <i class="bi bi-rss-fill me-2 text-warning"></i>NewsFeed
        </a>
        <div class="navbar-nav ms-auto">
            <a class="nav-link active" href="/feeds">Sources</a>
            <a class="nav-link" href="/search">Search</a>
            <a class="nav-link" href="/digest">Daily Digest</a>
            <a class="nav-link" href="/reports">Reports</a>
            <a class="nav-link" href="/astocks">A股</a>
            <a class="nav-link" href="/reports/backups">Backups</a>
            <a class="nav-link" href="/tags">Tags</a>
            <form th:action="@{/logout}" method="post" class="d-inline">
                <button type="submit" class="btn btn-link nav-link">
                    <i class="bi bi-box-arrow-right me-1"></i>Logout
                </button>
            </form>
        </div>
    </div>
</nav>

<div class="container mt-4">
    <div th:if="${successMsg}" class="alert alert-success alert-dismissible fade show" role="alert">
        <i class="bi bi-check-circle me-2"></i><span th:text="${successMsg}"></span>
        <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
    </div>
    <div th:if="${errorMsg}" class="alert alert-danger alert-dismissible fade show" role="alert">
        <i class="bi bi-exclamation-triangle me-2"></i><span th:text="${errorMsg}"></span>
        <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
    </div>

    <div class="d-flex justify-content-between align-items-center mb-4">
        <h2 class="mb-0">RSS Feed Sources</h2>
        <button class="btn btn-primary" data-bs-toggle="modal" data-bs-target="#feedModal"
                onclick="resetForm()">
            <i class="bi bi-plus-lg me-1"></i>Add Source
        </button>
    </div>

    <!-- Filter row -->
    <form method="get" action="/feeds" class="row g-2 mb-3 align-items-end" id="feedFilterForm">
        <div class="col-auto">
            <label class="form-label form-label-sm mb-0">Tags</label>
            <div id="filterTagPicker" class="dropdown" style="min-width: 260px;">
                    <div class="tag-picker-trigger d-flex flex-wrap align-items-center gap-1 p-2 border border-secondary rounded"
                         data-bs-toggle="dropdown" data-bs-auto-close="outside" aria-expanded="false"
                         style="min-height: 38px; cursor: pointer; background-color: var(--bs-body-bg);">
                        <small class="text-muted tag-placeholder">未选择标签</small>
                        <i class="bi bi-chevron-down ms-auto text-muted" style="font-size: 0.75rem;"></i>
                    </div>
                    <ul class="dropdown-menu dropdown-menu-dark w-100 p-2"
                        style="max-height: 300px; overflow-y: auto;"></ul>
                    <input type="hidden" id="filterTagPickerHidden"
                           th:value="${tagIds != null ? #strings.listJoin(tagIds, ',') : ''}">
                </div>
        </div>
        <div class="col-auto">
            <label for="filterEnabled" class="form-label form-label-sm mb-0">Status</label>
            <select class="form-select form-select-sm" id="filterEnabled" name="enabled" style="min-width:140px;">
                <option value="">All Status</option>
                <option value="true" th:selected="${enabled == true}">Active</option>
                <option value="false" th:selected="${enabled == false}">Disabled</option>
            </select>
        </div>
        <div class="col-auto">
            <label for="feedPageSize" class="form-label form-label-sm mb-0">Per Page</label>
            <select class="form-select form-select-sm" id="feedPageSize" name="size" style="min-width:90px;">
                <option value="10">10</option>
                <option value="25">25</option>
                <option value="50">50</option>
                <option value="100">100</option>
            </select>
        </div>
        <div class="col-auto">
            <button type="submit" class="btn btn-sm btn-outline-primary">
                <i class="bi bi-search me-1"></i>Search
            </button>
            <a href="/feeds" class="btn btn-sm btn-outline-secondary" id="clearFeedFilters">
                <i class="bi bi-x-lg me-1"></i>Clear
            </a>
        </div>
    </form>

    <div class="table-responsive">
        <table class="table table-dark table-striped table-hover align-middle">
            <thead>
            <tr>
                <th>Status</th>
                <th>Name</th>
                <th>URL</th>
                <th>Protocol</th>
                <th>Tags</th>
                <th>Interval</th>
                <th>Last Fetched</th>
                <th>Articles</th>
                <th>Actions</th>
            </tr>
            </thead>
            <tbody id="feedTableBody"></tbody>
        </table>
    </div>

    <div id="feedPagination"></div>

<!-- Feed Modal -->
<div class="modal fade" id="feedModal" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog">
        <div class="modal-content bg-dark">
            <div class="modal-header border-secondary">
                <h5 class="modal-title" id="feedModalTitle">Add Feed Source</h5>
                <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
            </div>
            <form id="feedForm" method="post">
                <input type="hidden" name="_csrf" th:value="${_csrf.token}"/>
                <input type="hidden" name="page" id="feedPage" value="0">
                <input type="hidden" name="filterTagIds" id="feedFilterTagIdsParam"
                       th:value="${tagIds != null ? #strings.listJoin(tagIds, ',') : ''}">
                <input type="hidden" name="filterEnabled" id="feedFilterEnabledParam" th:value="${enabled}">
                <div class="modal-body">
                    <div class="mb-3">
                        <label for="feedName" class="form-label">Name</label>
                        <input type="text" class="form-control" id="feedName" name="name"
                               placeholder="e.g. BBC News" required>
                    </div>
                    <div class="mb-3">
                        <label for="feedUrl" class="form-label">RSS URL</label>
                        <input type="url" class="form-control" id="feedUrl" name="url"
                               placeholder="https://example.com/rss" required>
                    </div>
                    <div class="mb-3">
                        <label for="feedProtocol" class="form-label">Protocol</label>
                        <select class="form-select" id="feedProtocol" name="protocol">
                            <option value="RSS">RSS</option>
                            <option value="ATOM">ATOM</option>
                        </select>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Tags</label>
                        <div id="modalTagPicker" class="dropdown">
                            <div class="tag-picker-trigger d-flex flex-wrap align-items-center gap-1 p-2 border border-secondary rounded"
                                 data-bs-toggle="dropdown" data-bs-auto-close="outside" aria-expanded="false"
                                 style="min-height: 38px; cursor: pointer; background-color: var(--bs-body-bg);">
                                <small class="text-muted tag-placeholder">未选择标签</small>
                                <i class="bi bi-chevron-down ms-auto text-muted" style="font-size: 0.75rem;"></i>
                            </div>
                            <ul class="dropdown-menu dropdown-menu-dark w-100 p-2"
                                style="max-height: 300px; overflow-y: auto;"></ul>
                            <input type="hidden" id="modalTagPickerHidden" value="">
                        </div>
                    </div>
                    <div class="mb-3">
                        <label for="feedInterval" class="form-label">Fetch Interval (minutes)</label>
                        <input type="number" class="form-control" id="feedInterval" name="fetchIntervalMinutes"
                               value="15" min="1" max="1440" required>
                    </div>
                    <div class="mb-3">
                        <div class="form-check form-switch">
                            <input class="form-check-input" type="checkbox" id="feedEnabled" name="enabled" value="true">
                            <label class="form-check-label" for="feedEnabled">Enabled</label>
                        </div>
                    </div>
                    <div class="mb-3">
                        <div class="form-check form-switch">
                            <input class="form-check-input" type="checkbox" id="feedAiCategorize" name="aiCategorize" value="true">
                            <label class="form-check-label" for="feedAiCategorize">AI自动分类</label>
                        </div>
                    </div>
                </div>
                <div class="modal-footer border-secondary">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
                    <button type="submit" class="btn btn-primary" id="feedSubmitBtn">Add</button>
                </div>
            </form>
        </div>
    </div>
</div>

<form id="deleteForm" method="post" style="display:none;">
    <input type="hidden" name="_method" value="DELETE">
    <input type="hidden" name="_csrf" th:value="${_csrf.token}"/>
</form>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="/js/ajax-pagination.js"></script>
<script th:inline="javascript">
    var allTags = [[${tags}]];
</script>
<script>
    function initTagPicker(containerId, tags, selectedIds) {
        var container = document.getElementById(containerId);
        var menu = container.querySelector('.dropdown-menu');
        selectedIds = (selectedIds || []).map(function(s) { return String(s); });

        menu.innerHTML = '';
        if (tags.length === 0) {
            var emptyLi = document.createElement('li');
            emptyLi.innerHTML = '<span class="dropdown-item-text text-muted small">No tags available</span>';
            menu.appendChild(emptyLi);
        } else {
            tags.forEach(function(tag) {
                var li = document.createElement('li');
                var div = document.createElement('div');
                div.className = 'form-check';
                var input = document.createElement('input');
                input.className = 'form-check-input filter-tag-check';
                input.type = 'checkbox';
                input.name = 'tagIds';
                input.value = tag.id;
                var inputId = containerId + '_tag_' + tag.id;
                input.id = inputId;
                if (selectedIds.indexOf(String(tag.id)) !== -1) {
                    input.checked = true;
                }
                var label = document.createElement('label');
                label.className = 'form-check-label d-flex align-items-center gap-2';
                label.htmlFor = inputId;
                label.innerHTML = '<span class="badge" style="background-color:' + tag.color + '">'
                    + tag.name + '</span>';
                div.appendChild(input);
                div.appendChild(label);
                li.appendChild(div);
                menu.appendChild(li);
                input.addEventListener('change', function() { syncTagPicker(container, tags); });
            });
        }
        syncTagPicker(container, tags);
    }

    function syncTagPicker(container, tags) {
        var trigger = container.querySelector('.tag-picker-trigger');
        var checked = container.querySelectorAll('.form-check-input:checked');
        var selectedIds = [];

        var badges = [];
        checked.forEach(function(cb) {
            var tagId = cb.value;
            selectedIds.push(tagId);
            var tag = null;
            for (var i = 0; i < tags.length; i++) {
                if (String(tags[i].id) === String(tagId)) { tag = tags[i]; break; }
            }
            var name = tag ? tag.name : tagId;
            var color = tag ? tag.color : '#6c757d';
            badges.push({ id: tagId, name: name, color: color, cb: cb });
        });

        trigger.innerHTML = '';
        if (badges.length === 0) {
            var placeholder = document.createElement('small');
            placeholder.className = 'text-muted tag-placeholder';
            placeholder.textContent = '未选择标签';
            trigger.appendChild(placeholder);
        } else {
            badges.forEach(function(b) {
                var badge = document.createElement('span');
                badge.className = 'badge d-inline-flex align-items-center';
                badge.style.backgroundColor = b.color;
                badge.innerHTML = b.name + ' <button type="button" class="btn-close btn-close-white ms-1"'
                    + ' style="font-size:0.6em;" aria-label="Remove"></button>';
                badge.querySelector('button').addEventListener('click', function(e) {
                    e.stopPropagation();
                    b.cb.checked = false;
                    syncTagPicker(container, tags);
                });
                trigger.appendChild(badge);
            });
        }
        var chevron = document.createElement('i');
        chevron.className = 'bi bi-chevron-down ms-auto text-muted';
        chevron.style.fontSize = '0.75rem';
        trigger.appendChild(chevron);

        var hidden = container.querySelector('input[type="hidden"]');
        if (hidden) {
            hidden.value = selectedIds.join(',');
        }
    }

    function filterFormSubmit(form) {
        var controls = form.querySelectorAll('select:not([multiple]), input:not([type=checkbox])');
        controls.forEach(function(ctrl) {
            if (ctrl.value === '' && ctrl.name) {
                ctrl.disabled = true;
            }
        });
        var tagChecks = form.querySelectorAll('.filter-tag-check');
        tagChecks.forEach(function(cb) {
            if (!cb.checked) cb.disabled = true;
        });
        return true;
    }

    var feedListState = new URLSearchParams(window.location.search);
    if (!feedListState.has('size')) feedListState.set('size', '10');
    var feedPageSize = feedListState.get('size');

    function appendHidden(form, name, value) {
        var input = document.createElement('input');
        input.type = 'hidden';
        input.name = name;
        input.value = value;
        form.appendChild(input);
    }

    function currentFeedTagIds() {
        return Array.from(document.querySelectorAll('#filterTagPicker .filter-tag-check:checked'))
            .map(function(checkbox) { return checkbox.value; });
    }

    function feedActionForm(action, className) {
        var form = document.createElement('form');
        form.action = action;
        form.method = 'post';
        form.className = className || 'd-inline';
        var csrf = document.querySelector('#deleteForm input[name="_csrf"]');
        if (csrf) appendHidden(form, '_csrf', csrf.value);
        return form;
    }

    function addCurrentFeedFilters(form, page, includeEnabled) {
        appendHidden(form, 'page', page);
        currentFeedTagIds().forEach(function(id) { appendHidden(form, 'tagIds', id); });
        var enabled = document.getElementById('filterEnabled').value;
        if (includeEnabled && enabled) appendHidden(form, 'enabled', enabled);
    }

    function renderFeedRow(source, page) {
        var row = document.createElement('tr');
        var statusCell = row.insertCell();
        var toggle = feedActionForm('/feeds/' + source.id + '/toggle');
        appendHidden(toggle, 'enabled', String(!source.enabled));
        addCurrentFeedFilters(toggle, page, false);
        var toggleButton = AjaxPagination.element('button', 'btn btn-sm p-0 border-0 bg-transparent');
        toggleButton.type = 'submit';
        var status = AjaxPagination.element('span', 'badge ' + (source.enabled ? 'bg-success' : 'bg-secondary'));
        status.appendChild(AjaxPagination.element('i', source.enabled ? 'bi bi-check-circle' : 'bi bi-pause-circle'));
        status.appendChild(document.createTextNode(source.enabled ? ' Active' : ' Disabled'));
        toggleButton.appendChild(status);
        toggle.appendChild(toggleButton);
        statusCell.appendChild(toggle);

        row.insertCell().appendChild(AjaxPagination.element('span', 'fw-semibold', source.name));
        var urlCell = row.insertCell();
        if (source.safeUrl) {
            var url = AjaxPagination.element('a', 'text-info text-truncate d-inline-block', source.url);
            url.href = source.safeUrl;
            url.target = '_blank';
            url.rel = 'noopener noreferrer';
            url.style.maxWidth = '250px';
            urlCell.appendChild(url);
        } else {
            urlCell.appendChild(AjaxPagination.element('span', 'text-muted', source.url || '-'));
        }
        row.insertCell().appendChild(AjaxPagination.element('span', 'badge bg-info', source.protocol));
        var tagsCell = row.insertCell();
        if (source.tags.length) {
            source.tags.forEach(function(tag) {
                var badge = AjaxPagination.element('span', 'badge me-1', tag.name);
                badge.style.backgroundColor = tag.color;
                tagsCell.appendChild(badge);
            });
        } else {
            tagsCell.appendChild(AjaxPagination.element('span', 'text-muted', '-'));
        }
        row.insertCell().textContent = source.fetchIntervalMinutes + ' min';
        var fetchedCell = row.insertCell();
        fetchedCell.textContent = source.lastFetchedAt ? AjaxPagination.dateTime(source.lastFetchedAt) : 'Never';
        if (!source.lastFetchedAt) fetchedCell.className = 'text-muted';
        var countCell = row.insertCell();
        countCell.appendChild(AjaxPagination.element('span', 'badge bg-dark border border-secondary', source.articleCount));

        var actions = row.insertCell();
        var group = AjaxPagination.element('div', 'btn-group btn-group-sm');
        var edit = AjaxPagination.element('button', 'btn btn-outline-primary');
        edit.type = 'button';
        edit.title = 'Edit';
        edit.appendChild(AjaxPagination.element('i', 'bi bi-pencil'));
        Object.assign(edit.dataset, {
            id: source.id, name: source.name, url: source.url, protocol: source.protocol,
            interval: source.fetchIntervalMinutes, enabled: source.enabled,
            aiCategorize: source.aiCategorize, page: page,
            tagIds: source.tags.map(function(tag) { return tag.id; }).join(',')
        });
        edit.addEventListener('click', function() { editFeed(edit); });
        group.appendChild(edit);

        var fetchForm = feedActionForm('/feeds/' + source.id + '/fetch');
        addCurrentFeedFilters(fetchForm, page, true);
        var fetchButton = AjaxPagination.element('button', 'btn btn-outline-warning');
        fetchButton.type = 'submit';
        fetchButton.title = 'Fetch Now';
        fetchButton.appendChild(AjaxPagination.element('i', 'bi bi-arrow-clockwise'));
        fetchForm.appendChild(fetchButton);
        group.appendChild(fetchForm);

        var remove = AjaxPagination.element('button', 'btn btn-outline-danger');
        remove.type = 'button';
        remove.title = 'Delete';
        remove.appendChild(AjaxPagination.element('i', 'bi bi-trash'));
        Object.assign(remove.dataset, {
            name: source.name, id: source.id, page: page,
            tagIds: currentFeedTagIds().join(','), enabled: document.getElementById('filterEnabled').value
        });
        remove.addEventListener('click', function() { confirmDelete(remove); });
        group.appendChild(remove);
        actions.appendChild(group);
        return row;
    }

    function loadFeeds(page) {
        feedListState = new URLSearchParams();
        currentFeedTagIds().forEach(function(id) { feedListState.append('tagIds', id); });
        var enabled = document.getElementById('filterEnabled').value;
        if (enabled) feedListState.set('enabled', enabled);
        feedListState.set('size', feedPageSize);
        feedListState.set('page', String(page));
        AjaxPagination.request('/feeds/api', feedListState).then(function(data) {
            feedListState.set('page', String(data.number));
            feedPageSize = String(data.size);
            feedListState.set('size', feedPageSize);
            document.getElementById('feedPageSize').value = feedPageSize;
            var body = document.getElementById('feedTableBody');
            body.replaceChildren();
            data.content.forEach(function(source) { body.appendChild(renderFeedRow(source, data.number)); });
            if (!data.content.length) {
                var row = document.createElement('tr');
                var cell = row.insertCell();
                cell.colSpan = 9;
                cell.className = 'text-center text-muted py-4';
                cell.textContent = 'No feed sources configured. Click "Add Source" to get started.';
                body.appendChild(row);
            }
            document.getElementById('feedPagination').replaceChildren(
                AjaxPagination.pagination(data, loadFeeds, { jump: true, rangeOnlyWhenPaginated: true }));
            document.getElementById('feedPage').value = data.number;
            document.getElementById('feedFilterTagIdsParam').value = currentFeedTagIds().join(',');
            document.getElementById('feedFilterEnabledParam').value = enabled;
            history.replaceState(null, '', '/feeds?' + feedListState.toString());
        }).catch(function(error) { window.alert(error.message); });
    }

    function resetForm() {
        document.getElementById('feedModalTitle').textContent = 'Add Feed Source';
        document.getElementById('feedSubmitBtn').textContent = 'Add';
        document.getElementById('feedForm').action = '/feeds';
        document.getElementById('feedForm').method = 'post';
        document.getElementById('feedName').value = '';
        document.getElementById('feedUrl').value = '';
        document.getElementById('feedProtocol').value = 'RSS';
        document.getElementById('feedInterval').value = '15';
        document.getElementById('feedEnabled').checked = true;
        document.getElementById('feedAiCategorize').checked = false;
        var methodInput = document.getElementById('_methodInput');
        if (methodInput) methodInput.remove();
        initTagPicker('modalTagPicker', allTags, []);
    }

    function editFeed(btn) {
        document.getElementById('feedModalTitle').textContent = 'Edit Feed Source';
        document.getElementById('feedSubmitBtn').textContent = 'Update';
        var page = btn.dataset.page || 0;
        document.getElementById('feedForm').action = '/feeds/' + btn.dataset.id + '?page=' + page;
        document.getElementById('feedForm').method = 'post';
        document.getElementById('feedPage').value = page;

        var methodInput = document.getElementById('_methodInput');
        if (!methodInput) {
            methodInput = document.createElement('input');
            methodInput.type = 'hidden';
            methodInput.name = '_method';
            methodInput.value = 'PUT';
            methodInput.id = '_methodInput';
            document.getElementById('feedForm').appendChild(methodInput);
        } else {
            methodInput.value = 'PUT';
        }

        document.getElementById('feedName').value = btn.dataset.name;
        document.getElementById('feedUrl').value = btn.dataset.url;
        document.getElementById('feedProtocol').value = btn.dataset.protocol;
        document.getElementById('feedInterval').value = btn.dataset.interval;
        document.getElementById('feedEnabled').checked = btn.dataset.enabled === 'true';
        document.getElementById('feedAiCategorize').checked = btn.dataset.aiCategorize === 'true';

        var tagIds = (btn.dataset.tagIds || '').split(',').filter(function(s) { return s.trim() !== ''; });
        initTagPicker('modalTagPicker', allTags, tagIds);

        var modal = new bootstrap.Modal(document.getElementById('feedModal'));
        modal.show();
    }

    function confirmDelete(btn) {
        if (confirm('Are you sure you want to delete "' + btn.dataset.name + '"? All associated articles will also be deleted.')) {
            var form = document.getElementById('deleteForm');
            var page = btn.dataset.page || 0;
            var action = '/feeds/' + btn.dataset.id + '?page=' + page;
            var tagIds = btn.dataset.tagIds;
            var enabled = btn.dataset.enabled;
            if (tagIds) {
                var ids = tagIds.split(',');
                ids.forEach(function(id) {
                    if (id.trim()) action += '&tagIds=' + id.trim();
                });
            }
            if (enabled) action += '&enabled=' + enabled;
            form.action = action;
            form.submit();
        }
    }

    document.addEventListener('DOMContentLoaded', function() {
        var urlState = new URLSearchParams(window.location.search);
        var filterHidden = document.getElementById('filterTagPickerHidden');
        var initialTagIds = [];
        if (urlState.has('tagIds')) {
            urlState.getAll('tagIds').forEach(function(value) {
                value.split(',').forEach(function(id) { if (id.trim()) initialTagIds.push(id.trim()); });
            });
        } else if (filterHidden && filterHidden.value) {
            initialTagIds = filterHidden.value.split(',').filter(function(s) { return s.trim() !== ''; });
        }
        if (urlState.has('enabled')) document.getElementById('filterEnabled').value = urlState.get('enabled');
        feedPageSize = urlState.get('size') || '10';
        document.getElementById('feedPageSize').value = feedPageSize;
        var initialPage = Math.max(0, parseInt(urlState.get('page'), 10) || 0);
        initTagPicker('filterTagPicker', allTags, initialTagIds);
        initTagPicker('modalTagPicker', allTags, []);
        document.getElementById('feedFilterForm').addEventListener('submit', function(event) {
            event.preventDefault();
            loadFeeds(0);
        });
        document.getElementById('clearFeedFilters').addEventListener('click', function(event) {
            event.preventDefault();
            document.getElementById('filterEnabled').value = '';
            initTagPicker('filterTagPicker', allTags, []);
            loadFeeds(0);
        });
        document.getElementById('feedPageSize').addEventListener('change', function() {
            feedPageSize = this.value;
            loadFeeds(0);
        });
        loadFeeds(initialPage);
    });
</script>
</body>
</html>
