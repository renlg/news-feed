<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" data-bs-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Feed Sources - NewsFeed</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <link href="/css/style.css" rel="stylesheet">
</head>
<body>
<nav class="navbar navbar-expand-lg navbar-dark bg-dark border-bottom border-secondary">
    <div class="container">
        <a class="navbar-brand fw-bold" href="/feeds">
            <i class="bi bi-rss-fill me-2 text-warning"></i>NewsFeed
        </a>
        <div class="navbar-nav ms-auto">
            <a class="nav-link active" href="/feeds">Sources</a>
            <a class="nav-link" href="/search">Search</a>
            <a class="nav-link" href="/reports">Reports</a>
            <a class="nav-link" href="/reports/backups">Backups</a>
            <form th:action="@{/logout}" method="post" class="d-inline">
                <button type="submit" class="btn btn-link nav-link">
                    <i class="bi bi-box-arrow-right me-1"></i>Logout
                </button>
            </form>
        </div>
    </div>
</nav>

<div class="container mt-4">
    <div th:if="${successMsg}" class="alert alert-success alert-dismissible fade show" role="alert">
        <i class="bi bi-check-circle me-2"></i><span th:text="${successMsg}"></span>
        <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
    </div>
    <div th:if="${errorMsg}" class="alert alert-danger alert-dismissible fade show" role="alert">
        <i class="bi bi-exclamation-triangle me-2"></i><span th:text="${errorMsg}"></span>
        <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
    </div>

    <div class="d-flex justify-content-between align-items-center mb-4">
        <h2 class="mb-0">RSS Feed Sources</h2>
        <button class="btn btn-primary" data-bs-toggle="modal" data-bs-target="#feedModal"
                onclick="resetForm()">
            <i class="bi bi-plus-lg me-1"></i>Add Source
        </button>
    </div>

    <div class="table-responsive">
        <table class="table table-dark table-striped table-hover align-middle">
            <thead>
            <tr>
                <th>Status</th>
                <th>Name</th>
                <th>URL</th>
                <th>Protocol</th>
                <th>Interval</th>
                <th>Last Fetched</th>
                <th>Articles</th>
                <th>Actions</th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="source : ${sources}">
                <td>
                    <form th:action="@{/feeds/{id}/toggle(id=${source.id})}" method="post" class="d-inline">
                        <input type="hidden" name="enabled" th:value="${!source.enabled}">
                        <input type="hidden" name="page" th:value="${sourcePage.number}">
                        <button type="submit" class="btn btn-sm p-0 border-0 bg-transparent">
                            <span th:if="${source.enabled}" class="badge bg-success">
                                <i class="bi bi-check-circle"></i> Active
                            </span>
                            <span th:unless="${source.enabled}" class="badge bg-secondary">
                                <i class="bi bi-pause-circle"></i> Disabled
                            </span>
                        </button>
                    </form>
                </td>
                <td class="fw-semibold" th:text="${source.name}">Source Name</td>
                <td>
                    <a th:href="${source.url}" target="_blank" class="text-info text-truncate d-inline-block"
                       style="max-width: 250px;" th:text="${source.url}">URL</a>
                </td>
                <td><span class="badge bg-info" th:text="${source.protocol}">RSS</span></td>
                <td th:text="${source.fetchIntervalMinutes + ' min'}">15 min</td>
                <td>
                    <span th:if="${source.lastFetchedAt}"
                          th:text="${#temporals.format(source.lastFetchedAt, 'yyyy-MM-dd HH:mm')}">
                        Never
                    </span>
                    <span th:unless="${source.lastFetchedAt}" class="text-muted">Never</span>
                </td>
                <td>
                    <span class="badge bg-dark border border-secondary"
                          th:text="${articleCounts[source.id]}">0</span>
                </td>
                <td>
                    <div class="btn-group btn-group-sm">
                        <button class="btn btn-outline-primary" title="Edit"
                                th:data-id="${source.id}"
                                th:data-name="${source.name}"
                                th:data-url="${source.url}"
                                th:data-protocol="${source.protocol}"
                                th:data-interval="${source.fetchIntervalMinutes}"
                                th:data-enabled="${source.enabled}"
                                th:data-page="${sourcePage.number}"
                                onclick="editFeed(this)">
                            <i class="bi bi-pencil"></i>
                        </button>
                        <form th:action="@{/feeds/{id}/fetch(id=${source.id})}" method="post"
                              class="d-inline">
                            <input type="hidden" name="page" th:value="${sourcePage.number}">
                            <button type="submit" class="btn btn-outline-warning" title="Fetch Now">
                                <i class="bi bi-arrow-clockwise"></i>
                            </button>
                        </form>
                        <button class="btn btn-outline-danger" title="Delete"
                                th:data-name="${source.name}"
                                th:data-id="${source.id}"
                                th:data-page="${sourcePage.number}"
                                onclick="confirmDelete(this)">
                            <i class="bi bi-trash"></i>
                        </button>
                    </div>
                </td>
            </tr>
            <tr th:if="${#lists.isEmpty(sources)}">
                <td colspan="8" class="text-center text-muted py-4">
                    No feed sources configured. Click "Add Source" to get started.
                </td>
            </tr>
            </tbody>
        </table>
    </div>

    <!-- Pagination -->
    <div th:if="${sourcePage != null and sourcePage.totalPages > 1}" class="d-flex justify-content-between align-items-center mt-3">
        <div class="text-muted">
            <span th:text="'Showing ' + ${sourcePage.number * sourcePage.size + 1} + '-' + ${sourcePage.number * sourcePage.size + sources.size()} + ' of ' + ${sourcePage.totalElements}"></span>
        </div>
        <nav>
            <ul class="pagination pagination-sm mb-0">
                <li class="page-item" th:classappend="${sourcePage.first} ? 'disabled'">
                    <a class="page-link" th:href="@{/feeds(page=${sourcePage.number - 1})}" aria-label="Previous">
                        <span aria-hidden="true">&laquo;</span>
                    </a>
                </li>
                <li th:if="${sourcePage.totalPages > 1}" class="page-item"
                    th:classappend="${sourcePage.number == 0} ? 'active'">
                    <a class="page-link" th:href="@{/feeds(page=0)}">1</a>
                </li>
                <li th:if="${sourcePage.number > 3}" class="page-item disabled">
                    <span class="page-link">…</span>
                </li>
                <li th:each="i : ${#numbers.sequence(sourcePage.number - 1, sourcePage.number + 1)}"
                    th:if="${i > 0 && i < sourcePage.totalPages - 1}"
                    class="page-item" th:classappend="${i == sourcePage.number} ? 'active'">
                    <a class="page-link" th:href="@{/feeds(page=${i})}" th:text="${i + 1}">1</a>
                </li>
                <li th:if="${sourcePage.number < sourcePage.totalPages - 4}" class="page-item disabled">
                    <span class="page-link">…</span>
                </li>
                <li th:if="${sourcePage.totalPages > 1}" class="page-item"
                    th:classappend="${sourcePage.number == sourcePage.totalPages - 1} ? 'active'">
                    <a class="page-link" th:href="@{/feeds(page=${sourcePage.totalPages - 1})}" th:text="${sourcePage.totalPages}">Last</a>
                </li>
                <li class="page-item" th:classappend="${sourcePage.last} ? 'disabled'">
                    <a class="page-link" th:href="@{/feeds(page=${sourcePage.number + 1})}" aria-label="Next">
                        <span aria-hidden="true">&raquo;</span>
                    </a>
                </li>
            </ul>
        </nav>
        <div class="d-flex align-items-center gap-1 ms-3">
            <input type="number" class="form-control form-control-sm" id="feedsPageJump"
                   min="1" th:max="${sourcePage.totalPages}" th:value="${sourcePage.number + 1}"
                   style="width: 60px;" placeholder="Page"
                   onkeydown="if(event.key==='Enter')document.getElementById('feedsPageJumpBtn').click()">
            <button class="btn btn-sm btn-outline-secondary" id="feedsPageJumpBtn"
                    th:data-total="${sourcePage.totalPages}">Go</button>
        </div>
    </div>

<div class="modal fade" id="feedModal" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog">
        <div class="modal-content bg-dark">
            <div class="modal-header border-secondary">
                <h5 class="modal-title" id="feedModalTitle">Add Feed Source</h5>
                <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
            </div>
            <form id="feedForm" method="post">
                <input type="hidden" name="_csrf" th:value="${_csrf.token}"/>
                <div class="modal-body">
                    <div class="mb-3">
                        <label for="feedName" class="form-label">Name</label>
                        <input type="text" class="form-control" id="feedName" name="name"
                               placeholder="e.g. BBC News" required>
                    </div>
                    <div class="mb-3">
                        <label for="feedUrl" class="form-label">RSS URL</label>
                        <input type="url" class="form-control" id="feedUrl" name="url"
                               placeholder="https://example.com/rss" required>
                    </div>
                    <div class="mb-3">
                        <label for="feedProtocol" class="form-label">Protocol</label>
                        <select class="form-select" id="feedProtocol" name="protocol">
                            <option value="RSS">RSS</option>
                            <option value="ATOM">ATOM</option>
                        </select>
                    </div>
                    <div class="mb-3">
                        <label for="feedInterval" class="form-label">Fetch Interval (minutes)</label>
                        <input type="number" class="form-control" id="feedInterval" name="fetchIntervalMinutes"
                               value="15" min="1" max="1440" required>
                    </div>
                    <div class="mb-3">
                        <div class="form-check form-switch">
                            <input class="form-check-input" type="checkbox" id="feedEnabled" name="enabled" value="true">
                            <label class="form-check-label" for="feedEnabled">Enabled</label>
                        </div>
                    </div>
                </div>
                <div class="modal-footer border-secondary">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
                    <button type="submit" class="btn btn-primary" id="feedSubmitBtn">Add</button>
                </div>
            </form>
        </div>
    </div>
</div>

<form id="deleteForm" method="post" style="display:none;">
    <input type="hidden" name="_method" value="DELETE">
    <input type="hidden" name="_csrf" th:value="${_csrf.token}"/>
</form>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script>
    function resetForm() {
        document.getElementById('feedModalTitle').textContent = 'Add Feed Source';
        document.getElementById('feedSubmitBtn').textContent = 'Add';
        document.getElementById('feedForm').action = '/feeds';
        document.getElementById('feedForm').method = 'post';
        document.getElementById('feedName').value = '';
        document.getElementById('feedUrl').value = '';
        document.getElementById('feedProtocol').value = 'RSS';
        document.getElementById('feedInterval').value = '15';
        document.getElementById('feedEnabled').checked = true;
    }

    function editFeed(btn) {
        document.getElementById('feedModalTitle').textContent = 'Edit Feed Source';
        document.getElementById('feedSubmitBtn').textContent = 'Update';
        document.getElementById('feedForm').action = '/feeds/' + btn.dataset.id + '?page=' + (btn.dataset.page || 0);
        document.getElementById('feedForm').method = 'post';

        var methodInput = document.getElementById('_methodInput');
        if (!methodInput) {
            methodInput = document.createElement('input');
            methodInput.type = 'hidden';
            methodInput.name = '_method';
            methodInput.value = 'PUT';
            methodInput.id = '_methodInput';
            document.getElementById('feedForm').appendChild(methodInput);
        } else {
            methodInput.value = 'PUT';
        }

        document.getElementById('feedName').value = btn.dataset.name;
        document.getElementById('feedUrl').value = btn.dataset.url;
        document.getElementById('feedProtocol').value = btn.dataset.protocol;
        document.getElementById('feedInterval').value = btn.dataset.interval;
        document.getElementById('feedEnabled').checked = btn.dataset.enabled === 'true';

        var modal = new bootstrap.Modal(document.getElementById('feedModal'));
        modal.show();
    }

    document.getElementById('feedsPageJumpBtn').addEventListener('click', function() {
        var input = document.getElementById('feedsPageJump');
        var p = parseInt(input.value);
        var total = parseInt(this.dataset.total);
        if (p >= 1 && p <= total) {
            window.location.href = '/feeds?page=' + (p - 1);
        }
    });

    function confirmDelete(btn) {
        if (confirm('Are you sure you want to delete "' + btn.dataset.name + '"? All associated articles will also be deleted.')) {
            var form = document.getElementById('deleteForm');
            var page = btn.dataset.page || 0;
            form.action = '/feeds/' + btn.dataset.id + '?page=' + page;
            form.submit();
        }
    }
</script>
</body>
</html>
